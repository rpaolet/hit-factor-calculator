<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hit Factor Calculator IPSC/USPSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 select-none">

    <!-- Header Stage -->
    <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bullseye text-amber-500 text-xl"></i>
                <h1 class="font-bold text-lg text-amber-400 leading-none">Hit Factor</h1>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-400">STAGE:</span>
                <select id="stageSelector" onchange="changeActiveStage()" class="bg-slate-800 border border-slate-700 text-amber-400 font-bold rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="Stage 1">Stage 1</option>
                    <option value="Stage 2">Stage 2</option>
                    <option value="Stage 3">Stage 3</option>
                    <option value="Stage 4">Stage 4</option>
                    <option value="Stage 5">Stage 5</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Form Inserimento -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center justify-between">
                <span class="flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-amber-500"></i> Nuovo Inserimento
                </span>
                <button onclick="openManageShootersModal()" class="text-slate-400 hover:text-amber-400 text-[11px] font-normal underline">
                    Gestisci Tiratori
                </button>
            </h2>

            <div class="space-y-4">
                <!-- Selezione / Aggiunta Nome Tiratore -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nome Tiratore</label>
                    <select id="selectNome" onchange="handleNomeChange()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 text-base">
                        <!-- Popolato dinamicamente -->
                    </select>
                    
                    <!-- Campo di testo nascosto per nuovo tiratore -->
                    <div id="containerNuovoNome" class="hidden mt-2 flex gap-2">
                        <input type="text" id="inputNuovoNome" placeholder="Inserisci il nuovo nome" class="flex-1 bg-slate-950 border border-amber-500/50 rounded-xl px-4 py-2 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm">
                        <button onclick="confirmNewShooter()" class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs hover:bg-amber-400">Aggiungi</button>
                    </div>
                </div>

                <!-- Griglia Punteggi Alfa, Charlie, Delta, Miss -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-emerald-400 block">ALFA</span>
                            <span class="text-[10px] text-slate-500">+5 pt</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="adjustVal('inputAlfa', -1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 font-bold active:bg-slate-700">-</button>
                            <input type="number" id="inputAlfa" value="0" min="0" inputmode="numeric" class="w-10 text-center font-bold bg-transparent text-white focus:outline-none text-base">
                            <button onclick="adjustVal('inputAlfa', 1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 font-bold active:bg-slate-700">+</button>
                        </div>
                    </div>

                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-blue-400 block">CHARLIE</span>
                            <span class="text-[10px] text-slate-500">+3 pt</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="adjustVal('inputCharlie', -1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 font-bold active:bg-slate-700">-</button>
                            <input type="number" id="inputCharlie" value="0" min="0" inputmode="numeric" class="w-10 text-center font-bold bg-transparent text-white focus:outline-none text-base">
                            <button onclick="adjustVal('inputCharlie', 1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 font-bold active:bg-slate-700">+</button>
                        </div>
                    </div>

                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-amber-400 block">DELTA</span>
                            <span class="text-[10px] text-slate-500">+1 pt</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="adjustVal('inputDelta', -1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 font-bold active:bg-slate-700">-</button>
                            <input type="number" id="inputDelta" value="0" min="0" inputmode="numeric" class="w-10 text-center font-bold bg-transparent text-white focus:outline-none text-base">
                            <button onclick="adjustVal('inputDelta', 1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 font-bold active:bg-slate-700">+</button>
                        </div>
                    </div>

                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-rose-500 block">MISS</span>
                            <span class="text-[10px] text-slate-500">-10 pt</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="adjustVal('inputMiss', -1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 font-bold active:bg-slate-700">-</button>
                            <input type="number" id="inputMiss" value="0" min="0" inputmode="numeric" class="w-10 text-center font-bold bg-transparent text-white focus:outline-none text-base">
                            <button onclick="adjustVal('inputMiss', 1)" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 font-bold active:bg-slate-700">+</button>
                        </div>
                    </div>
                </div>

                <!-- Input Tempo -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Tempo (Secondi)</label>
                    <div class="relative">
                        <input type="number" id="inputTempo" step="0.01" min="0.01" placeholder="0.00" inputmode="decimal" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 font-bold text-lg">
                        <span class="absolute right-4 top-3.5 text-xs text-slate-500 font-semibold">SEC</span>
                    </div>
                </div>

                <button onclick="saveResult()" class="w-full bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-slate-950 font-bold rounded-xl py-3.5 transition-all shadow-lg shadow-amber-500/20 text-base">
                    <i class="fa-solid fa-plus-circle mr-1"></i> Registra Risultato
                </button>
            </div>
        </section>

        <!-- Classifica -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-amber-500"></i> Classifica
                </h2>
                <select id="filterStage" onchange="renderLeaderboard()" class="bg-slate-950 border border-slate-800 text-xs font-semibold text-slate-300 rounded-lg px-2.5 py-1">
                    <option value="ALL">Tutti gli Stage</option>
                </select>
            </div>

            <div id="leaderboardList" class="space-y-2"></div>

            <div class="pt-2 flex gap-2">
                <button onclick="shareWhatsApp()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs py-2.5 rounded-lg flex items-center justify-center gap-1.5">
                    <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                </button>
                <button onclick="clearLeaderboard()" class="px-3 bg-slate-800 hover:bg-rose-900/40 text-slate-400 hover:text-rose-400 text-xs font-semibold rounded-lg">
                    Reset
                </button>
            </div>
        </section>
    </main>

    <!-- Modal Gestione Tiratori -->
    <div id="manageShootersModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-amber-400">Gestisci Tiratori</h3>
                <button onclick="closeManageShootersModal()" class="text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <p class="text-xs text-slate-400">Elimina i tiratori che non ti servono più dalla lista:</p>
            
            <div id="manageShootersList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Popolato dinamicamente -->
            </div>

            <div class="pt-2">
                <button onclick="closeManageShootersModal()" class="w-full bg-slate-800 text-slate-300 font-semibold py-2.5 rounded-xl text-xs">Chiudi</button>
            </div>
        </div>
    </div>

    <!-- Modal Modifica Risultato -->
    <div id="editModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-amber-400">Modifica Risultato</h3>
                <button onclick="closeEditModal()" class="text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <input type="hidden" id="editId">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Stage</label>
                    <input type="text" id="editStage" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nome Tiratore</label>
                    <input type="text" id="editNome" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-sm">
                </div>
                <div class="grid grid-cols-4 gap-2 text-center">
                    <div>
                        <span class="text-[10px] text-emerald-400 font-bold block">A</span>
                        <input type="number" id="editAlfa" inputmode="numeric" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-1.5 text-center text-white text-sm">
                    </div>
                    <div>
                        <span class="text-[10px] text-blue-400 font-bold block">C</span>
                        <input type="number" id="editCharlie" inputmode="numeric" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-1.5 text-center text-white text-sm">
                    </div>
                    <div>
                        <span class="text-[10px] text-amber-400 font-bold block">D</span>
                        <input type="number" id="editDelta" inputmode="numeric" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-1.5 text-center text-white text-sm">
                    </div>
                    <div>
                        <span class="text-[10px] text-rose-500 font-bold block">M</span>
                        <input type="number" id="editMiss" inputmode="numeric" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-1.5 text-center text-white text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tempo (s)</label>
                    <input type="number" id="editTempo" step="0.01" inputmode="decimal" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white text-sm font-bold">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeEditModal()" class="flex-1 bg-slate-800 text-slate-300 font-semibold py-2.5 rounded-xl text-xs">Annulla</button>
                <button onclick="submitEdit()" class="flex-1 bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Salva</button>
            </div>
        </div>
    </div>

    <script>
        function getShooters() {
            return JSON.parse(localStorage.getItem('hf_shooters') || '["Mario Rossi"]');
        }

        function saveShooters(shooters) {
            localStorage.setItem('hf_shooters', JSON.stringify(shooters));
            renderShootersSelect();
        }

        function renderShootersSelect(selectedShooter = null) {
            const select = document.getElementById('selectNome');
            const shooters = getShooters();
            
            select.innerHTML = '<option value="" disabled selected>Seleziona un tiratore</option>';
            shooters.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            });

            const newOpt = document.createElement('option');
            newOpt.value = "__NEW__";
            newOpt.textContent = "+ Aggiungi Nuovo Tiratore...";
            select.appendChild(newOpt);

            if (selectedShooter) {
                select.value = selectedShooter;
            } else {
                select.selectedIndex = 0;
            }
        }

        function handleNomeChange() {
            const select = document.getElementById('selectNome');
            const container = document.getElementById('containerNuovoNome');
            if (select.value === '__NEW__') {
                container.classList.remove('hidden');
                document.getElementById('inputNuovoNome').focus();
            } else {
                container.classList.add('hidden');
            }
        }

        function confirmNewShooter() {
            const input = document.getElementById('inputNuovoNome');
            const nome = input.value.trim();
            if (!nome) { alert('Inserisci un nome valido'); return; }

            const shooters = getShooters();
            if (!shooters.includes(nome)) {
                shooters.push(nome);
                saveShooters(shooters);
            }
            
            renderShootersSelect(nome);
            input.value = '';
            document.getElementById('containerNuovoNome').classList.add('hidden');
        }

        function openManageShootersModal() {
            renderManageShootersList();
            document.getElementById('manageShootersModal').classList.remove('hidden');
        }

        function closeManageShootersModal() {
            document.getElementById('manageShootersModal').classList.add('hidden');
        }

        function renderManageShootersList() {
            const listContainer = document.getElementById('manageShootersList');
            const shooters = getShooters();
            listContainer.innerHTML = '';

            if (shooters.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-4 text-slate-500 text-xs">Nessun tiratore salvato</div>';
                return;
            }

            shooters.forEach(s => {
                const item = document.createElement('div');
                item.className = 'bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between';
                item.innerHTML = `
                    <span class="text-sm font-medium text-slate-200">${s}</span>
                    <button onclick="deleteShooter('${s}')" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                `;
                listContainer.appendChild(item);
            });
        }

        function deleteShooter(nome) {
            if (confirm(`Vuoi rimuovere "${nome}" dalla lista dei tiratori?`)) {
                let shooters = getShooters();
                shooters = shooters.filter(s => s !== nome);
                saveShooters(shooters);
                renderManageShootersList();
                renderShootersSelect();
            }
        }

        function adjustVal(id, delta) {
            const el = document.getElementById(id);
            let val = parseInt(el.value) || 0;
            val = Math.max(0, val + delta);
            el.value = val;
        }

        function getData() {
            return JSON.parse(localStorage.getItem('hf_data') || '[]');
        }

        function saveData(data) {
            localStorage.setItem('hf_data', JSON.stringify(data));
            renderLeaderboard();
            updateFilterOptions();
        }

        function changeActiveStage() {
            renderLeaderboard();
        }

        function saveResult() {
            const selectNome = document.getElementById('selectNome');
            let nome = selectNome.value;

            if (nome === '__NEW__' || !nome) {
                alert('Seleziona o aggiungi prima un tiratore'); 
                return; 
            }

            const alfa = parseInt(document.getElementById('inputAlfa').value) || 0;
            const charlie = parseInt(document.getElementById('inputCharlie').value) || 0;
            const delta = parseInt(document.getElementById('inputDelta').value) || 0;
            const miss = parseInt(document.getElementById('inputMiss').value) || 0;
            const tempo = parseFloat(document.getElementById('inputTempo').value) || 0;
            const stage = document.getElementById('stageSelector').value;

            if (tempo <= 0) { alert('Inserisci un tempo valido'); return; }

            const punti = (alfa * 5) + (charlie * 3) + (delta * 1) - (miss * 10);
            const hitFactor = punti / tempo;

            const entry = { id: Date.now(), stage, nome, alfa, charlie, delta, miss, punti, tempo, hitFactor };
            const data = getData();
            data.push(entry);
            saveData(data);

            // Reset form
            renderShootersSelect();
            document.getElementById('containerNuovoNome').classList.add('hidden');
            document.getElementById('inputAlfa').value = 0;
            document.getElementById('inputCharlie').value = 0;
            document.getElementById('inputDelta').value = 0;
            document.getElementById('inputMiss').value = 0;
            document.getElementById('inputTempo').value = '';
        }

        function renderLeaderboard() {
            const list = document.getElementById('leaderboardList');
            const filterStage = document.getElementById('filterStage').value;
            let data = getData();

            if (filterStage !== 'ALL') {
                data = data.filter(d => d.stage === filterStage);
            }

            data.sort((a, b) => b.hitFactor - a.hitFactor);
            list.innerHTML = '';

            if (data.length === 0) {
                list.innerHTML = '<div class="text-center py-6 text-slate-600 text-xs">Nessun risultato registrato</div>';
                return;
            }

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-slate-950 border ${index === 0 ? 'border-amber-500/50' : 'border-slate-800'} p-3 rounded-xl flex items-center justify-between`;
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-full ${index === 0 ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'} text-xs font-bold flex items-center justify-center">${index + 1}</span>
                        <div>
                            <div class="font-bold text-sm text-slate-200">${item.nome}</div>
                            <div class="text-[10px] text-slate-500 flex gap-2">
                                <span>${item.stage}</span>
                                <span>A:${item.alfa} C:${item.charlie} D:${item.delta} M:${item.miss}</span>
                                <span>${item.tempo.toFixed(2)}s</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <div class="text-sm font-extrabold text-amber-400">${item.hitFactor.toFixed(4)}</div>
                            <div class="text-[10px] text-slate-500">${item.punti} pt</div>
                        </div>
                        <button onclick="openEditModal(${item.id})" class="text-slate-600 hover:text-amber-400 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="deleteEntry(${item.id})" class="text-slate-600 hover:text-rose-400 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function updateFilterOptions() {
            const data = getData();
            const filter = document.getElementById('filterStage');
            const stages = [...new Set(data.map(d => d.stage))];
            
            const currentVal = filter.value;
            filter.innerHTML = '<option value="ALL">Tutti gli Stage</option>';
            stages.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                filter.appendChild(opt);
            });
            filter.value = currentVal;
        }

        function openEditModal(id) {
            const data = getData();
            const item = data.find(d => d.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('editStage').value = item.stage;
            document.getElementById('editNome').value = item.nome;
            document.getElementById('editAlfa').value = item.alfa;
            document.getElementById('editCharlie').value = item.charlie;
            document.getElementById('editDelta').value = item.delta;
            document.getElementById('editMiss').value = item.miss;
            document.getElementById('editTempo').value = item.tempo;

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function submitEdit() {
            const id = parseInt(document.getElementById('editId').value);
            let data = getData();
            const index = data.findIndex(d => d.id === id);
            if (index === -1) return;

            const alfa = parseInt(document.getElementById('editAlfa').value) || 0;
            const charlie = parseInt(document.getElementById('editCharlie').value) || 0;
            const delta = parseInt(document.getElementById('editDelta').value) || 0;
            const miss = parseInt(document.getElementById('editMiss').value) || 0;
            const tempo = parseFloat(document.getElementById('editTempo').value) || 0;

            const punti = (alfa * 5) + (charlie * 3) + (delta * 1) - (miss * 10);
            const hitFactor = tempo > 0 ? punti / tempo : 0;

            data[index] = {
                ...data[index],
                stage: document.getElementById('editStage').value.trim(),
                nome: document.getElementById('editNome').value.trim(),
                alfa, charlie, delta, miss, punti, tempo, hitFactor
            };

            saveData(data);
            closeEditModal();
        }

        function deleteEntry(id) {
            if (confirm('Vuoi eliminare questa riga?')) {
                let data = getData();
                data = data.filter(d => d.id !== id);
                saveData(data);
            }
        }

        function clearLeaderboard() {
            if (confirm('Cancellare la classifica intera?')) {
                localStorage.removeItem('hf_data');
                renderLeaderboard();
                updateFilterOptions();
            }
        }

        function shareWhatsApp() {
            let data = getData();
            if (data.length === 0) return;
            data.sort((a, b) => b.hitFactor - a.hitFactor);
            let msg = "*CLASSIFICA HIT FACTOR*\n\n";
            data.forEach((d, i) => {
                msg += `${i+1}. *${d.nome}* (${d.stage})\nHF: ${d.hitFactor.toFixed(4)} | Punti: ${d.punti} | Tempo: ${d.tempo}s\n\n`;
            });
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // Inizializzazione
        renderShootersSelect();
        renderLeaderboard();
        updateFilterOptions();
    </script>
</body>
</html>
